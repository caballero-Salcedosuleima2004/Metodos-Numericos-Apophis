site_name: "Misión: Apophis 2029 - Defensa Planetaria"

theme:
  name: material

  palette:

    - scheme: slate
      primary: black
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Cambiar a modo claro

    - scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/weather-night
        name: Cambiar a modo oscuro

  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.code.annotate

markdown_extensions:

  - admonition

  - pymdownx.details

  - pymdownx.superfences

  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

extra_css:
  - stylesheets/extra.css

nav:
  - 🌌 Misión Apophis: index.md

  - 📜 El Legado de Kepler: historia.md

  - 📐 Teoría: teoria.md

  - 🔢 Operaciones: operaciones.md

  - 💻 Código en C: codigo.md

  - 📈 Convergencia del Método: convergencia.md

  - 🛰️ Simulador en vivo: simulador.md

  - 💥 Análisis: analisis.md

  - 📖 Referencias: referencias.md

  - 👤 Autor: autor.md
